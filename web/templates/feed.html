<div class="page-header">
  <div>
    <div class="mono" style="font-size:12px; color:var(--color-driftwood); text-transform:uppercase; margin-bottom:4px;">Campus Public Bulletin</div>
    <h1>Lost &amp; Found Feed</h1>
    <p class="page-subtitle">Track, report, and recover personal belongings across the CEC campus.</p>
  </div>
  <div style="display:flex; gap:12px; align-items:center;">
    {{postButton}}
  </div>
</div>

<div style="margin-bottom:24px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
  <div style="display:flex; gap:8px;">
    <a href="/feed" class="btn btn-secondary {{filterAllActive}}">All Items</a>
    <a href="/feed?type=LOST" class="btn btn-secondary {{filterLostActive}}"><span class="tag-chip tag-lost">LOST</span> Only</a>
    <a href="/feed?type=FOUND" class="btn btn-secondary {{filterFoundActive}}"><span class="tag-chip tag-found">FOUND</span> Only</a>
  </div>
  <div class="mono" style="font-size:13px; color:var(--color-driftwood);">
    Total records: <strong>{{postCount}}</strong>
  </div>
</div>

<div class="grid-cards">
  {{cardsHtml}}
</div>

<!-- Modal: Post Notice (Modal reserved 8px border-radius) -->
<div class="modal-overlay" id="postModal">
  <div class="modal-dialog">
    <div class="modal-header">
      <h3>Create Campus Notice</h3>
      <button type="button" class="btn btn-ghost" onclick="closeModal('postModal')">&times;</button>
    </div>
    <form method="POST" action="/feed/create">
      <div class="form-group">
        <label class="form-label" for="postType">Notice Type</label>
        <select id="postType" name="postType" class="form-select mono" required>
          <option value="LOST">LOST — I misplaced an item</option>
          <option value="FOUND">FOUND — I discovered an item</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="category">Category</label>
        <select id="category" name="category" class="form-select mono" required>
          <option value="Electronics">Electronics (Laptop, Phone, Charger, Calculator)</option>
          <option value="ID Card & Documents">ID Card &amp; Academic Documents</option>
          <option value="Keys & Wallets">Keys, Wallets &amp; Badges</option>
          <option value="Books & Stationery">Books &amp; Stationery</option>
          <option value="Accessories & Apparel">Accessories &amp; Apparel</option>
          <option value="Other">Other Items</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="title">Title / Item Summary</label>
        <div class="terminal-input-wrapper">
          <span class="terminal-prefix">&gt;</span>
          <input type="text" id="title" name="title" class="form-input terminal-input" placeholder="e.g. Blue HP Scientific Calculator in Lab 3" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="description">Detailed Description &amp; Last Known Location</label>
        <textarea id="description" name="description" class="form-textarea" placeholder="Describe distinguishing marks, colors, specific time/location found or lost..." required></textarea>
      </div>

      <div class="form-group">
        <label class="form-label" for="imagePath">Photo / Attachment Reference (Optional)</label>
        <div class="terminal-input-wrapper">
          <span class="terminal-prefix">&gt;</span>
          <input type="text" id="imagePath" name="imagePath" class="form-input terminal-input" placeholder="e.g. uploads/calculator_photo.jpg">
        </div>
      </div>

      <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:24px;">
        <button type="button" class="btn btn-secondary" onclick="closeModal('postModal')">Cancel</button>
        <button type="submit" class="btn btn-primary">Publish Notice &rarr;</button>
      </div>
    </form>
  </div>
</div>

<script>
  function openModal(id) {
    const el = document.getElementById(id);
    if (el) el.style.display = 'flex';
  }
  function closeModal(id) {
    const el = document.getElementById(id);
    if (el) el.style.display = 'none';
  }
</script>
