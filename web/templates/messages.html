<div class="page-header">
  <div>
    <div class="section-label">
      <span>💬</span> Direct Communication
    </div>
    <h1>Private <span class="highlight-pill pill-marigold">Messages</span></h1>
    <p class="page-subtitle">Coordinate returns and follow-ups securely with notice authors.</p>
  </div>
</div>

<div class="messaging-layout">
  <!-- Thread sidebar -->
  <aside class="thread-list">
    <div style="padding:14px 16px; border-bottom:var(--border-hairline); background-color:var(--color-paper-warmth); display:flex; align-items:center; gap:8px;">
      <span style="font-size:14px;">📬</span>
      <span style="font-size:12px; font-weight:600; text-transform:uppercase; color:var(--color-stone); letter-spacing:0.04em;">Inbox Conversations</span>
    </div>
    <div>
      {{threadListHtml}}
    </div>
  </aside>

  <!-- Active conversation pane -->
  <section class="chat-pane">
    <div class="chat-header">
      <div style="display:flex; align-items:center; gap:12px;">
        <div class="avatar-mark mark-sky mark-sm">👤</div>
        <div>
          <h4 style="margin:0; font-size:16px; font-weight:600;">{{activeChatTitle}}</h4>
          <span class="mono" style="font-size:12px; color:var(--color-stone);">{{activeChatSubtitle}}</span>
        </div>
      </div>
      <div>
        {{activeChatBadge}}
      </div>
    </div>

    <div class="chat-messages" id="chatMessages">
      {{chatMessagesHtml}}
    </div>

    <form method="POST" action="/messages/send" class="chat-composer">
      <input type="hidden" name="postId" value="{{activePostId}}">
      <input type="hidden" name="receiverId" value="{{activeReceiverId}}">
      <div class="terminal-input-wrapper" style="flex:1;">
        <span class="terminal-prefix">&gt;</span>
        <input type="text" name="content" class="form-input terminal-input" placeholder="Type your message..." required autocomplete="off" {{inputDisabled}}>
      </div>
      <button type="submit" class="btn btn-amber" {{buttonDisabled}}>Send &rarr;</button>
    </form>
  </section>
</div>

<script>
  // Scroll chat messages to bottom
  const chatDiv = document.getElementById('chatMessages');
  if (chatDiv) {
    chatDiv.scrollTop = chatDiv.scrollHeight;
  }
</script>
